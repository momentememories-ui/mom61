<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สุขสันต์วันแม่!</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffb7c5;
            --accent: #ff758c;
            --bg-light: #fff0f3;
            --pastel-pink: #ffccd5;
            --text-pink: #d81b60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #1e1e24;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* กรอบจำลองหน้าจอมือถือแนวตั้ง */
        .mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        /* ----- หน้า 1: หน้าเล่นเกมสลับภาพ ----- */
        #game-page {
            padding: 30px 20px;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe3e8 100%);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .header-title {
            text-align: center;
            margin-top: 10px;
        }

        .header-title h1 {
            font-size: 24px;
            color: var(--text-pink);
            font-weight: 800;
            text-shadow: 1px 1px 0px #fff;
        }

        .header-title p {
            font-size: 15px;
            color: #636e72;
            margin-top: 6px;
        }

        /* กระดานสลับภาพ */
        .board-wrapper {
            width: 100%;
            max-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .puzzle-board {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background: var(--pastel-pink);
            border: 5px solid var(--primary);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.25);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease, gap 0.3s ease;
        }

        /* เอฟเฟกต์ไร้รอยต่อเมื่อต่อเสร็จ */
        .puzzle-board.completed {
            gap: 0px;
            border-color: var(--accent);
        }

        .puzzle-piece {
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            cursor: grab;
            transition: transform 0.15s ease, opacity 0.15s ease, border-radius 0.3s ease;
            box-sizing: border-box;
            border-radius: 6px;
            touch-action: none;
        }

        .puzzle-board.completed .puzzle-piece {
            border-radius: 0px;
        }

        .puzzle-piece:active {
            cursor: grabbing;
        }

        .footer-hint {
            font-size: 14px;
            color: var(--text-pink);
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--pastel-pink);
            box-shadow: 0 2px 8px rgba(255, 117, 140, 0.1);
        }

        /* Modal เมื่อต่อเสร็จ */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 52, 54, 0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #fff;
            padding: 25px 20px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid var(--primary);
        }

        .success-title {
            color: var(--text-pink);
            font-size: 20px;
            font-weight: 800;
        }

        .money-text {
            color: #2d3436;
            font-size: 17px;
            font-weight: 700;
            margin: 15px 0 20px 0;
            background: var(--bg-light);
            padding: 12px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.15);
            border: 1.5px solid var(--primary);
            letter-spacing: 0.3px;
            animation: bounceBounce 1.2s infinite ease-in-out;
            line-height: 1.5;
        }

        @keyframes bounceBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-8px) scale(1.03); }
            50% { transform: translateY(0) scale(0.98); }
            70% { transform: translateY(-4px) scale(1.01); }
        }

        .next-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            background: linear-gradient(135deg, #ffb7c5 0%, #ff758c 100%);
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.4);
            width: 100%;
            transition: transform 0.2s, background 0.2s;
        }

        .next-btn:active {
            transform: scale(0.98);
        }

        /* ----- หน้า 2: หน้าอวยพรวันแม่ (โชว์ photo5.png เต็มหน้าจอ) ----- */
        #wish-page {
            display: none;
            height: 100%;
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
    </style>
</head>
<body>

<!-- แท็กสำหรับเล่นเพลงซ้ำ (loop) -->
<audio id="bgMusic" src="song.mp3" loop preload="auto"></audio>

<div class="mobile-container">
    <!-- หน้า 1: เกมสลับภาพแบบลากวาง -->
    <div id="game-page">
        <div class="header-title">
            <h1>ต่อจิ๊กซอว์ลูกของคุณ🧩</h1>
            <p>ลากรูปไปสลับตำแหน่งกัน... ให้กลายเป็นรูปสวยๆนะ💕</p>
        </div>

        <!-- กระดานสลับภาพ 3x3 -->
        <div class="board-wrapper">
            <div class="puzzle-board" id="board"></div>
        </div>

        <div class="footer-hint">
            👆 แตะค้างที่รูป แล้วลากไปวางสลับกับรูปอื่นได้เลย!
        </div>
    </div>

    <!-- Modal แจ้งเตือนเมื่อเรียงถูกครบ -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="success-title">🎉 ยินดีด้วยยย! เรียงภาพถูกแล้ว!</div>
            <div style="font-size: 14px; color: #636e72; margin-top: 6px;">คุณแม่คนเก่ง เก่งที่สุดในโลกเลยยย 🥰</div>
            <div class="money-text">โอ๋รักแม่นะขอตัง100บาทหน่อย💸</div>
            <button class="next-btn" onclick="goToWishPage()">ไปอ่านการ์ดอวยพรกันต่อเลย ❤️</button>
        </div>
    </div>

    <!-- หน้า 2: หน้าคำอวยพรวันแม่ -->
    <div id="wish-page"></div>
</div>

<script>
    const BOARD_SIZE = 3; // 3x3
    const TOTAL_PIECES = BOARD_SIZE * BOARD_SIZE;
    const IMAGE_SRC = 'photo1.jpg'; // รูปสำหรับทำจิ๊กซอว์

    let board = document.getElementById('board');
    let currentPositions = []; // เก็บสถานะลำดับชิ้นส่วนปัจจุบัน
    let draggedIndex = null; // ดัชนีของรูปที่กำลังถูกลาก
    let isGameFinished = false; // สถานะจบเกมป้องกันการลากเล่นหลังชนะ

    // ระบบเล่นเพลงอัตโนมัติเมื่อกดสัมผัสหน้าจอครั้งแรก
    let isMusicStarted = false;
    function startMusic() {
        if (!isMusicStarted) {
            let music = document.getElementById('bgMusic');
            if (music) {
                music.play().then(() => {
                    isMusicStarted = true;
                }).catch(err => {
                    console.log("Autoplay waiting for user interaction:", err);
                });
            }
        }
    }

    window.addEventListener('click', startMusic, { once: true });
    window.addEventListener('touchstart', startMusic, { once: true });

    // อ่านขนาดภาพจริงเพื่อปรับอัตราส่วนกระดาน
    function initPuzzle() {
        let img = new Image();
        img.src = IMAGE_SRC;
        img.onload = function() {
            let aspectRatio = img.naturalHeight / img.naturalWidth;
            
            let boardWidth = board.clientWidth;
            let boardHeight = boardWidth * aspectRatio;
            board.style.height = `${boardHeight}px`;

            setupBoard(boardWidth, boardHeight);
        };
    }

    function setupBoard(boardWidth, boardHeight) {
        board.innerHTML = '';
        board.classList.remove('completed');
        isGameFinished = false;

        // สุ่มสลับลำดับชิ้นส่วน (Shuffle)
        currentPositions = Array.from({length: TOTAL_PIECES}, (_, i) => i);
        
        // วนลูปสุ่มให้มั่นใจว่าไม่ได้สุ่มออกมาตรงเป๊ะกับเฉลยตั้งแต่เริ่ม
        do {
            currentPositions.sort(() => Math.random() - 0.5);
        } while (isComplete());

        renderBoard(boardWidth, boardHeight);
    }

    // วาดชิ้นส่วนลงบนกระดานตามตำแหน่งในปัจจุบัน
    function renderBoard(boardWidth, boardHeight) {
        board.innerHTML = '';
        let pieceWidth = boardWidth / BOARD_SIZE;
        let pieceHeight = boardHeight / BOARD_SIZE;

        currentPositions.forEach((correctIndex, slotIndex) => {
            let piece = document.createElement('div');
            piece.classList.add('puzzle-piece');
            piece.dataset.slotIndex = slotIndex;
            piece.draggable = !isGameFinished;

            let row = Math.floor(correctIndex / BOARD_SIZE);
            let col = correctIndex % BOARD_SIZE;

            piece.style.backgroundImage = `url('${IMAGE_SRC}')`;
            piece.style.backgroundSize = `${boardWidth}px ${boardHeight}px`;
            piece.style.backgroundPosition = `-${col * pieceWidth}px -${row * pieceHeight}px`;

            // เพิ่ม Event Listeners เฉพาะกรณีที่เกมยังไม่จบ
            if (!isGameFinished) {
                addDragAndTouchEvents(piece, pieceWidth, pieceHeight);
            }

            board.appendChild(piece);
        });
    }

    // ฟังก์ชั่นจัดการการลากและวาง (Drag & Touch Events)
    function addDragAndTouchEvents(piece, pWidth, pHeight) {
        // --- Desktop Drag & Drop ---
        piece.addEventListener('dragstart', function (e) {
            if (isGameFinished) return;
            startMusic();
            draggedIndex = parseInt(this.dataset.slotIndex);
            e.dataTransfer.setData('text/plain', draggedIndex);
            this.style.opacity = '0.4';
        });

        piece.addEventListener('dragend', function () {
            this.style.opacity = '1';
        });

        piece.addEventListener('dragover', function (e) {
            e.preventDefault();
        });

        piece.addEventListener('drop', function (e) {
            e.preventDefault();
            if (isGameFinished) return;
            let targetIndex = parseInt(this.dataset.slotIndex);
            if (draggedIndex !== null && draggedIndex !== targetIndex) {
                swapPieces(draggedIndex, targetIndex);
            }
        });

        // --- Mobile Touch Drag & Swap ---
        let touchClone = null;

        piece.addEventListener('touchstart', function (e) {
            if (isGameFinished) return;
            startMusic();
            draggedIndex = parseInt(this.dataset.slotIndex);

            let touch = e.touches[0];
            touchClone = piece.cloneNode(true);
            touchClone.style.position = 'fixed';
            touchClone.style.width = `${pWidth}px`;
            touchClone.style.height = `${pHeight}px`;
            touchClone.style.zIndex = '1000';
            touchClone.style.pointerEvents = 'none';
            touchClone.style.opacity = '0.9';
            touchClone.style.boxShadow = '0 8px 16px rgba(0,0,0,0.3)';
            touchClone.style.left = (touch.clientX - (pWidth / 2)) + 'px';
            touchClone.style.top = (touch.clientY - (pHeight / 2)) + 'px';

            document.body.appendChild(touchClone);
            piece.style.opacity = '0.3';
        }, { passive: false });

        piece.addEventListener('touchmove', function (e) {
            if (!touchClone || isGameFinished) return;
            e.preventDefault();
            let touch = e.touches[0];
            touchClone.style.left = (touch.clientX - (pWidth / 2)) + 'px';
            touchClone.style.top = (touch.clientY - (pHeight / 2)) + 'px';
        }, { passive: false });

        piece.addEventListener('touchend', function (e) {
            if (!touchClone) return;

            let touch = e.changedTouches[0];
            touchClone.remove();
            touchClone = null;
            piece.style.opacity = '1';

            if (isGameFinished) return;

            // ตรวจหาชิ้นส่วนที่ถูกลากไปวางทับ
            let elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            let targetPiece = elementBelow ? elementBelow.closest('.puzzle-piece') : null;

            if (targetPiece) {
                let targetIndex = parseInt(targetPiece.dataset.slotIndex);
                if (draggedIndex !== null && draggedIndex !== targetIndex) {
                    swapPieces(draggedIndex, targetIndex);
                }
            }
            draggedIndex = null;
        });
    }

    // ฟังก์ชั่นสลับตำแหน่งระหว่าง 2 ภาพ
    function swapPieces(index1, index2) {
        let temp = currentPositions[index1];
        currentPositions[index1] = currentPositions[index2];
        currentPositions[index2] = temp;

        let boardWidth = board.clientWidth;
        let boardHeight = board.clientHeight;

        // เช็คว่าเรียงถูกต้องทั้งหมดหรือยัง
        if (isComplete()) {
            isGameFinished = true;
            board.classList.add('completed'); // รวมภาพให้เป็นแผ่นเดียวไร้รอยต่อ
            renderBoard(boardWidth, boardHeight);

            // ค้างดูรูปสมบูรณ์ 3 วินาที (3000 ms) ก่อนเด้ง Modal รางวัลขึ้นมา
            setTimeout(() => {
                document.getElementById('successModal').style.display = 'flex';
            }, 3000);
        } else {
            renderBoard(boardWidth, boardHeight);
        }
    }

    // ฟังก์ชั่นเช็คว่ารูปต่อถูกทั้งหมดหรือยัง
    function isComplete() {
        return currentPositions.every((val, index) => val === index);
    }

    // สลับไปยังหน้าการ์ดอวยพรวันแม่
    function goToWishPage() {
        document.getElementById('successModal').style.display = 'none';
        document.getElementById('game-page').style.display = 'none';
        
        let wishPage = document.getElementById('wish-page');
        wishPage.style.backgroundImage = "url('photo5.png')";
        wishPage.style.display = 'block';
    }

    window.onload = initPuzzle;
</script>

</body>
</html>
